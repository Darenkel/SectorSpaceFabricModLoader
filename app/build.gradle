def getGamePath() {
    Properties props = new Properties()
    File configFile = file('locVerifier_settings.properties')

    if (configFile.exists()) {
        configFile.withInputStream { props.load(it) }
        // Use the elvis operator (?:) to provide a fallback if the key is missing
        String path = props.getProperty('game_path') ?: "${projectDir}/libs/SectorSpace.jar"
        return file(path).absolutePath
    } else {
        Path gameDir = Paths.get("").toAbsolutePath();
    }

    return file("${projectDir}/libs/Sector Space.jar")
}

jar {
    manifest {
        attributes(
                // Point this to your LocVerifierApp or a new Launcher class
                'Main-Class': 'com.sector.bridge.KnotLauncher'
        )
    }
    // Include your code and UI dependencies
    from sourceSets.main.output

    // EXCLUDE Fabric/Game JARs to prevent the Cast Error
    from {
        configurations.runtimeClasspath
                .filter { file ->
                    !file.name.equals("Sector Space.jar") &&
                            !file.name.contains("fabric-loader") &&
                            !file.name.contains("asm") &&             // Exclude ASM
                            !file.name.contains("sponge-mixin")        // Exclude Mixin
                }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


