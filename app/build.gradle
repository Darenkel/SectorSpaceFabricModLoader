/*
* Build configuration for SSFML.
*
* Builds the Sector Space Fabric Mod Loader bridge JAR.
* The output JAR is written to build/libs/.
*/

plugins {
    id 'java'
}

base {
    archivesName = "new_SSFML_Build"
}

repositories {
    // 1. Fabric repository for the loader
    maven {
        url = uri("https://maven.fabricmc.net")
    }
    // 2. MavenCentral for standard libraries and testing
    mavenCentral()

    // 3. Sponge for Mixins
    maven {
        url = uri("https://repo.spongepowered.org/maven/")
    }
}

dependencies {
    // Sector Space Game JAR as a local dependency.
    //
    // This is required to compile against Sector Space classes, but it must not be bundled into the output JAR.
    compileOnly files("libs/Sector Space.jar")

    // Local libraries used by the bridge.
    //
    // These remain available during compilation.
    // The jar task below prevents Fabric Loader, ASM, Sponge Mixin, and the game JAR from being bundled into the final SSFML JAR.
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar'],
            exclude: ['Sector Space.jar']
    )

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

jar {
    manifest {
        attributes(
                // Point this to your Launcher class.
                'Main-Class': 'com.sector.bridge.KnotLauncher'
        )
    }

    // Include runtime dependencies while excluding Fabric/Game JARs to prevent the Cast Error.
    from {
        configurations.runtimeClasspath
                .filter { file ->
                    !file.name.equalsIgnoreCase("Sector Space.jar") &&
                            !file.name.contains("fabric-loader") &&
                            !file.name.contains("asm") &&
                            !file.name.contains("sponge-mixin")
                }
                .collect { file ->
                    file.isDirectory() ? file : zipTree(file)
                }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
