plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    //id 'net.fabricmc.fabric-loom' version '1.16.1'
}

base {
    archivesName = "new_SSFML_Build"
}

repositories {

    flatDir {
        dirs 'libs'
    }
    // 1. Fabric MUST be first for the loader
    maven {
        url = uri("https://maven.fabricmc.net")
    }
    maven {
        url = uri("https://fabricmc.net")
    }
    // 2. MavenCentral for standard libraries
    mavenCentral()
    // 3. Sponge for Mixins later
    maven {
        url = uri("https://repo.spongepowered.org/maven/")
    }
}

